<style>
  /* ============================================================
     Tokens — ConsumIQ Design System "Quiet Intelligence"
     ============================================================ */
  :root {
    --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --font-serif: "Instrument Serif", "Times New Roman", serif;

    --r-xs: 4px;  --r-sm: 6px;  --r-md: 8px;  --r-lg: 12px;
    --r-xl: 16px; --r-2xl: 20px; --r-full: 999px;

    --shadow-xs: 0 1px 2px rgba(15,18,30,.04), 0 0 0 .5px rgba(15,18,30,.06);
    --shadow-sm: 0 2px 6px rgba(15,18,30,.05), 0 0 0 .5px rgba(15,18,30,.06);
    --shadow-md: 0 6px 18px rgba(15,18,30,.07), 0 0 0 .5px rgba(15,18,30,.06);
    --shadow-lg: 0 16px 40px rgba(15,18,30,.09), 0 0 0 .5px rgba(15,18,30,.06);
    --shadow-xl: 0 28px 70px rgba(15,18,30,.14), 0 0 0 .5px rgba(15,18,30,.06);
  }

  [data-theme="light"] {
    color-scheme: light;
    --bg:          oklch(0.992 0.003 250);
    --bg-elev-1:   oklch(0.985 0.004 250);
    --bg-elev-2:   #ffffff;
    --bg-sunken:   oklch(0.965 0.006 250);
    --surface:     #ffffff;

    --border:      oklch(0.92 0.006 250);
    --border-strong: oklch(0.85 0.008 250);
    --divider:     oklch(0.945 0.005 250);

    --fg:          oklch(0.18 0.012 260);
    --fg-muted:    oklch(0.42 0.012 260);
    --fg-subtle:   oklch(0.58 0.012 260);
    --fg-faint:    oklch(0.72 0.010 260);
    --fg-inverse:  oklch(0.99 0.003 250);

    --brand:       oklch(0.52 0.155 268);
    --brand-hover: oklch(0.46 0.16 268);
    --brand-soft:  oklch(0.96 0.025 268);
    --brand-border: oklch(0.86 0.06 268);
    --brand-fg:    #ffffff;

    --success:     oklch(0.55 0.12 152);
    --success-soft: oklch(0.96 0.03 152);
    --success-border: oklch(0.86 0.06 152);

    --warning:     oklch(0.65 0.14 65);
    --warning-soft: oklch(0.965 0.04 75);
    --warning-border: oklch(0.85 0.08 70);

    --danger:      oklch(0.55 0.18 26);
    --danger-soft: oklch(0.965 0.03 26);
    --danger-border: oklch(0.86 0.07 26);

    --info:        oklch(0.55 0.12 230);
    --info-soft:   oklch(0.965 0.03 230);
    --info-border: oklch(0.86 0.06 230);

    --focus-ring:  oklch(0.55 0.18 268 / .35);
  }

  [data-theme="dark"] {
    color-scheme: dark;
    --bg:          oklch(0.16 0.012 260);
    --bg-elev-1:   oklch(0.195 0.013 260);
    --bg-elev-2:   oklch(0.225 0.013 260);
    --bg-sunken:   oklch(0.13 0.012 260);
    --surface:     oklch(0.205 0.013 260);

    --border:      oklch(0.30 0.012 260);
    --border-strong: oklch(0.40 0.014 260);
    --divider:     oklch(0.255 0.012 260);

    --fg:          oklch(0.97 0.004 250);
    --fg-muted:    oklch(0.78 0.010 260);
    --fg-subtle:   oklch(0.62 0.012 260);
    --fg-faint:    oklch(0.48 0.012 260);
    --fg-inverse:  oklch(0.16 0.012 260);

    --brand:       oklch(0.72 0.155 268);
    --brand-hover: oklch(0.78 0.16 268);
    --brand-soft:  oklch(0.30 0.06 268);
    --brand-border: oklch(0.42 0.08 268);
    --brand-fg:    oklch(0.16 0.012 260);

    --success:     oklch(0.78 0.14 152);
    --success-soft: oklch(0.28 0.05 152);
    --success-border: oklch(0.40 0.07 152);

    --warning:     oklch(0.82 0.14 75);
    --warning-soft: oklch(0.30 0.06 75);
    --warning-border: oklch(0.42 0.08 75);

    --danger:      oklch(0.72 0.18 26);
    --danger-soft: oklch(0.32 0.07 26);
    --danger-border: oklch(0.44 0.10 26);

    --info:        oklch(0.78 0.12 230);
    --info-soft:   oklch(0.30 0.05 230);
    --info-border: oklch(0.42 0.07 230);

    --focus-ring:  oklch(0.72 0.18 268 / .45);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "ss01", "cv11";
    transition: background-color .25s ease, color .25s ease;
    overflow-x: hidden;
  }
  ::selection { background: var(--brand); color: var(--brand-fg); }

  a { color: inherit; text-decoration: none; }

  /* ============================================================
     SKIP LINK (accessibility)
     ============================================================ */
  .skip-link {
    position: absolute; top: -40px; left: 0; z-index: 9999;
    background: var(--brand); color: var(--brand-fg);
    padding: 8px 16px; border-radius: 0 0 var(--r-md) 0;
    font-size: 14px; font-weight: 500; text-decoration: none;
    transition: top .12s ease;
  }
  .skip-link:focus { top: 0; }

  /* ============================================================
     NAV
     ============================================================ */
  .nav-wrap {
    position: sticky; top: 0; z-index: 40;
    backdrop-filter: saturate(1.4) blur(14px);
    -webkit-backdrop-filter: saturate(1.4) blur(14px);
    background: color-mix(in oklch, var(--bg) 78%, transparent);
    border-bottom: 1px solid var(--divider);
  }
  .nav {
    max-width: 1320px; margin: 0 auto;
    padding: 14px 32px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 32px;
  }
  .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 500; font-size: 16px; letter-spacing: -0.012em;
  }
  .logo-mark {
    width: 22px; height: 22px;
    border-radius: 6px;
    background:
      conic-gradient(from 220deg at 50% 50%,
        var(--brand) 0deg, color-mix(in oklch, var(--brand) 60%, var(--fg)) 140deg,
        var(--brand) 360deg);
    position: relative;
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.18), var(--shadow-xs);
  }
  .logo-mark::after {
    content: ""; position: absolute; inset: 6px;
    background: var(--bg);
    border-radius: 2px;
  }
  .logo-mark::before {
    content: ""; position: absolute; inset: 9px;
    background: var(--brand);
    border-radius: 1px;
    z-index: 1;
  }
  .logo .by {
    font-family: var(--font-mono);
    font-size: 10.5px; color: var(--fg-faint);
    letter-spacing: .04em;
    margin-left: 6px;
  }
  .nav-links {
    display: flex; gap: 2px; justify-self: center;
  }
  .nav-link {
    font-size: 13.5px; font-weight: 500; color: var(--fg-muted);
    padding: 8px 12px; border-radius: var(--r-md);
    display: inline-flex; align-items: center; gap: 5px;
    cursor: pointer;
    transition: color .12s ease, background .12s ease;
  }
  .nav-link:hover { color: var(--fg); background: color-mix(in oklch, var(--fg) 4%, transparent); }
  .nav-link .caret {
    width: 8px; height: 8px;
    border-right: 1.2px solid currentColor;
    border-bottom: 1.2px solid currentColor;
    transform: rotate(45deg) translate(-2px, -2px);
    opacity: .55;
  }
  .nav-cta {
    display: flex; gap: 8px; align-items: center;
  }

  /* Mega menu */
  .mega {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(100% + 6px);
    width: min(880px, 92vw);
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-xl);
    padding: 24px;
    display: none;
  }
  .nav-item { position: relative; }
  .nav-item:hover .mega,
  .nav-item:focus-within .mega { display: block; }
  .mega-grid {
    display: grid;
    grid-template-columns: 1.1fr 1fr 1fr;
    gap: 28px;
  }
  .mega-col h4 {
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 500;
    color: var(--fg-faint); letter-spacing: .1em;
    text-transform: uppercase;
    margin: 0 0 10px;
  }
  .mega-item {
    display: flex; gap: 12px; padding: 10px; border-radius: var(--r-md);
    margin: 0 -10px;
    cursor: pointer;
    transition: background .12s ease;
  }
  .mega-item:hover { background: var(--bg-sunken); }
  .mega-item .glyph {
    width: 28px; height: 28px; border-radius: var(--r-sm);
    flex-shrink: 0;
    background: var(--brand-soft);
    border: 1px solid var(--brand-border);
    display: grid; place-items: center;
    color: var(--brand);
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  }
  .mega-item .text b {
    display: block; font-weight: 500; font-size: 13.5px; color: var(--fg);
    margin-bottom: 2px;
  }
  .mega-item .text span { font-size: 12px; color: var(--fg-muted); line-height: 1.4; }
  .mega-item.star .glyph {
    background: var(--brand); color: var(--brand-fg); border-color: var(--brand);
  }
  .mega-feature {
    grid-column: 1; grid-row: 1 / span 2;
    background: var(--bg-sunken);
    border-radius: var(--r-lg);
    padding: 18px;
    display: flex; flex-direction: column; justify-content: space-between;
    min-height: 220px;
  }
  .mega-feature .eyebrow {
    font-family: var(--font-mono); font-size: 10.5px;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--fg-subtle);
  }
  .mega-feature h3 {
    font-size: 19px; font-weight: 500; letter-spacing: -0.012em;
    margin: 8px 0 0;
    line-height: 1.25;
  }
  .mega-feature h3 em {
    font-family: var(--font-serif); font-style: italic; color: var(--brand);
  }
  .mega-feature .arrow {
    font-family: var(--font-mono); font-size: 12px; color: var(--brand);
    display: inline-flex; gap: 6px; align-items: center;
  }

  /* ============================================================
     Buttons
     ============================================================ */
  .btn {
    appearance: none; border: 0; cursor: pointer;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 14px;
    line-height: 1;
    padding: 10px 16px;
    border-radius: var(--r-md);
    display: inline-flex; align-items: center; gap: 8px;
    transition: background .12s ease, color .12s ease, border-color .12s ease, transform .06s ease, box-shadow .12s ease;
    letter-spacing: -0.005em;
    text-decoration: none;
  }
  .btn:focus-visible { outline: 0; box-shadow: 0 0 0 3px var(--focus-ring); }
  .btn:active { transform: translateY(.5px); }
  .btn--primary {
    background: var(--brand); color: var(--brand-fg);
    box-shadow: var(--shadow-xs), inset 0 1px 0 rgba(255,255,255,.16);
  }
  .btn--primary:hover { background: var(--brand-hover); }
  .btn--secondary {
    background: var(--bg-elev-2); color: var(--fg);
    box-shadow: var(--shadow-xs);
  }
  .btn--secondary:hover { background: var(--bg-sunken); }
  .btn--ghost { background: transparent; color: var(--fg); }
  .btn--ghost:hover { background: color-mix(in oklch, var(--fg) 6%, transparent); }
  .btn--sm { font-size: 12.5px; padding: 7px 12px; border-radius: var(--r-sm); }
  .btn--lg { font-size: 15px; padding: 13px 22px; border-radius: var(--r-lg); }
  .btn .arrow { transition: transform .12s ease; }
  .btn:hover .arrow { transform: translateX(2px); }

  /* ============================================================
     Shared section chrome
     ============================================================ */
  .shell { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
  .shell-wide { max-width: 1320px; margin: 0 auto; padding: 0 32px; }

  .eyebrow {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--fg-subtle);
    display: inline-flex; align-items: center; gap: 10px;
  }
  .eyebrow .num { color: var(--fg-faint); }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 999px; background: var(--brand);
    box-shadow: 0 0 0 4px color-mix(in oklch, var(--brand) 18%, transparent);
  }

  .section { padding: 100px 0; border-top: 1px solid var(--divider); }
  .section:first-child { border-top: 0; }

  .sec-head {
    display: grid; grid-template-columns: 1fr 1fr; gap: 64px;
    align-items: end;
    margin-bottom: 56px;
  }
  .sec-head h2 {
    font-weight: 400;
    font-size: clamp(36px, 4.4vw, 56px);
    letter-spacing: -0.028em;
    line-height: 1.05;
    margin: 16px 0 0;
    max-width: 18ch;
  }
  .sec-head h2 em {
    font-family: var(--font-serif);
    font-style: italic; font-weight: 400; color: var(--brand);
    letter-spacing: -0.02em;
  }
  .sec-head .lede {
    font-size: 17px; line-height: 1.55; color: var(--fg-muted);
    max-width: 48ch;
    margin: 0;
    padding-bottom: 8px;
  }

  /* ============================================================
     HERO
     ============================================================ */
  .hero {
    position: relative;
    padding: 80px 0 120px;
    overflow: hidden;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(70% 60% at 70% 0%,
        color-mix(in oklch, var(--brand) 8%, transparent) 0%,
        transparent 60%);
    pointer-events: none;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 72px;
    align-items: center;
    position: relative;
  }
  .hero h1 {
    font-weight: 400;
    font-size: clamp(48px, 6vw, 80px);
    line-height: 1.02;
    letter-spacing: -0.034em;
    margin: 24px 0 28px;
  }
  .hero h1 em {
    font-family: var(--font-serif);
    font-style: italic; font-weight: 400;
    color: var(--brand);
    letter-spacing: -0.025em;
  }
  .hero .lede {
    font-size: 19px; line-height: 1.55; color: var(--fg-muted);
    max-width: 52ch; margin: 0 0 32px;
  }
  .hero .cta-row {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin-bottom: 40px;
  }
  .hero .meta-row {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 28px; padding-top: 28px; border-top: 1px dashed var(--divider);
    max-width: 540px;
  }
  .hero .meta-row dt {
    font-family: var(--font-mono); font-size: 10.5px;
    color: var(--fg-faint); letter-spacing: .1em; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .hero .meta-row dd {
    margin: 0; font-size: 14px; color: var(--fg);
    line-height: 1.4;
  }
  .hero .meta-row dd em {
    font-family: var(--font-serif); font-style: italic;
    color: var(--brand); font-size: 17px; margin-right: 4px;
  }

  /* Unified-pipe diagram */
  .pipe-art {
    position: relative;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: var(--r-2xl);
    padding: 28px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }
  .pipe-art::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 70%, var(--bg-sunken) 100%);
    pointer-events: none;
  }
  .pipe-art .head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; position: relative;
  }
  .pipe-art .head .label {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--fg-subtle); letter-spacing: .08em; text-transform: uppercase;
  }
  .pipe-art .head .live {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--success); display: inline-flex; gap: 6px; align-items: center;
  }
  .pipe-art .head .live .blink {
    width: 6px; height: 6px; border-radius: 999px; background: var(--success);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--success) 22%, transparent);
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

  .pipe-stage {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    margin: 12px 0 20px;
    position: relative;
  }
  .pipe-stage .step {
    text-align: center; position: relative;
    padding: 12px 4px;
  }
  .pipe-stage .step .ico {
    width: 36px; height: 36px;
    margin: 0 auto 10px;
    border-radius: var(--r-md);
    background: var(--brand-soft);
    border: 1px solid var(--brand-border);
    color: var(--brand);
    display: grid; place-items: center;
    font-family: var(--font-mono); font-size: 12px; font-weight: 500;
    position: relative; z-index: 2;
  }
  .pipe-stage .step .ico.event {
    background: var(--brand); color: var(--brand-fg); border-color: var(--brand);
  }
  .pipe-stage .step b {
    display: block; font-size: 12.5px; font-weight: 500;
  }
  .pipe-stage .step span {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--fg-faint); letter-spacing: .04em;
    text-transform: uppercase;
    margin-top: 2px; display: block;
  }
  .pipe-stage::before {
    content: ""; position: absolute; left: 12.5%; right: 12.5%; top: 30px;
    height: 2px;
    background: linear-gradient(90deg, var(--brand) 0%, var(--brand) 100%);
    border-radius: 2px;
    z-index: 1;
  }
  .pipe-stage::after {
    content: ""; position: absolute; left: 12.5%; top: 28px;
    width: 6px; height: 6px; border-radius: 999px; background: var(--brand);
    box-shadow:
      40px 0 0 0 var(--brand-fg),
      40px 0 0 1.5px var(--brand);
    animation: travel 4s linear infinite;
    z-index: 3;
  }
  @keyframes travel {
    0%   { transform: translateX(0); opacity: 1; }
    90%  { transform: translateX(calc(100% + 4vw)); opacity: 1; }
    100% { transform: translateX(calc(100% + 4vw)); opacity: 0; }
  }

  .pipe-art .row {
    display: flex; justify-content: space-between;
    padding: 12px 0;
    border-top: 1px dashed var(--divider);
    font-size: 13px;
  }
  .pipe-art .row:first-of-type { border-top: 1px solid var(--divider); }
  .pipe-art .row .k { color: var(--fg-muted); }
  .pipe-art .row .v {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--fg);
  }
  .pipe-art .row .v em {
    font-family: var(--font-serif); font-style: italic;
    color: var(--brand); font-size: 16px;
  }

  /* Proof strip */
  .proof-strip {
    margin-top: 64px; padding-top: 36px;
    border-top: 1px solid var(--divider);
    display: flex; flex-direction: column; gap: 22px;
    align-items: center;
  }
  .proof-strip .cap {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--fg-subtle); letter-spacing: .14em;
    text-transform: uppercase;
  }
  .proof-strip .logos {
    display: flex; gap: 56px; flex-wrap: wrap; justify-content: center;
    opacity: .65;
  }
  .proof-strip .logos .logo-stub {
    font-family: var(--font-serif); font-style: italic;
    font-size: 22px; color: var(--fg-muted);
    letter-spacing: -0.01em;
  }
  .proof-strip .logos .logo-stub.s2 { font-family: var(--font-mono); font-style: normal; font-size: 14px; letter-spacing: .04em; }

  /* ============================================================
     FRAGMENTATION → UNIFICATION
     ============================================================ */
  .gap-compare {
    display: grid; grid-template-columns: 1fr 60px 1fr; gap: 24px;
    align-items: stretch;
  }
  .gap-pane {
    background: var(--bg-elev-1);
    border: 1px solid var(--border);
    border-radius: var(--r-2xl);
    padding: 28px;
    position: relative;
    min-height: 360px;
  }
  .gap-pane .pane-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 24px;
  }
  .gap-pane .pane-head h3 {
    margin: 0; font-size: 18px; font-weight: 500; letter-spacing: -0.012em;
  }
  .gap-pane .pane-head .tag {
    font-family: var(--font-mono); font-size: 10.5px;
    color: var(--fg-faint); letter-spacing: .08em; text-transform: uppercase;
  }
  .gap-pane.unified { background: var(--bg-elev-2); }
  .gap-pane.unified .pane-head .tag { color: var(--brand); }

  .frag-stack { display: grid; gap: 8px; }
  .frag-vendor {
    display: grid; grid-template-columns: auto 1fr auto; gap: 12px;
    align-items: center;
    padding: 12px 14px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
  }
  .frag-vendor .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--fg-faint); }
  .frag-vendor .name { font-size: 13.5px; font-weight: 500; }
  .frag-vendor .role {
    font-family: var(--font-mono); font-size: 10.5px;
    color: var(--fg-subtle); letter-spacing: .04em;
    text-transform: uppercase;
  }
  .frag-tape {
    position: relative; height: 14px;
    display: flex; justify-content: center; align-items: center;
  }
  .frag-tape::before, .frag-tape::after {
    content: ""; position: absolute; top: 50%;
    height: 1px; background: var(--border-strong);
    width: calc(50% - 32px);
  }
  .frag-tape::before { left: 0; }
  .frag-tape::after  { right: 0; }
  .frag-tape span {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--danger);
    letter-spacing: .1em; text-transform: uppercase;
    background: var(--bg-elev-1);
    padding: 0 8px;
    z-index: 1;
  }

  .frag-foot {
    margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--divider);
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    font-size: 12.5px;
    color: var(--fg-muted);
  }
  .frag-foot b { display: block; color: var(--danger); font-size: 22px; font-weight: 400; font-family: var(--font-serif); font-style: italic; }
  .gap-pane.unified .frag-foot b { color: var(--brand); }

  .uni-pipe {
    display: grid; grid-template-columns: 1fr; gap: 0;
    background: var(--bg-elev-1);
    border-radius: var(--r-lg);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .uni-row {
    display: grid; grid-template-columns: 40px 1fr auto;
    align-items: center; gap: 14px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--divider);
  }
  .uni-row:last-child { border-bottom: 0; }
  .uni-row .step {
    width: 28px; height: 28px; border-radius: var(--r-sm);
    background: var(--brand-soft);
    border: 1px solid var(--brand-border);
    color: var(--brand);
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    display: grid; place-items: center;
  }
  .uni-row .step.star { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); }
  .uni-row .name { font-size: 13.5px; font-weight: 500; }
  .uni-row .note {
    font-family: var(--font-mono); font-size: 10.5px;
    color: var(--fg-subtle); letter-spacing: .04em;
    text-transform: uppercase;
  }

  .gap-divider {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 14px;
    color: var(--fg-faint);
  }
  .gap-divider .arrow {
    font-family: var(--font-mono); font-size: 22px; color: var(--brand);
  }
  .gap-divider .word {
    font-family: var(--font-serif); font-style: italic;
    font-size: 18px; color: var(--brand);
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }

  /* ============================================================
     PLATFORM LAYERS (6 cards)
     ============================================================ */
  .layers-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .layer-card {
    background: var(--bg-elev-1);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    padding: 28px 26px;
    display: flex; flex-direction: column; gap: 16px;
    min-height: 240px;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    cursor: pointer;
  }
  .layer-card:hover {
    transform: translateY(-2px);
    border-color: var(--border-strong);
    box-shadow: var(--shadow-md);
  }
  .layer-card.star {
    background: var(--bg-elev-2);
    border-color: var(--brand-border);
  }
  .layer-card .head {
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .layer-card .num {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--fg-faint); letter-spacing: .08em;
  }
  .layer-card .tag {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--brand); letter-spacing: .12em; text-transform: uppercase;
    padding: 3px 7px;
    background: var(--brand-soft);
    border: 1px solid var(--brand-border);
    border-radius: var(--r-full);
  }
  .layer-card h3 {
    margin: 4px 0 0;
    font-size: 22px; font-weight: 500; letter-spacing: -0.012em;
    line-height: 1.2;
  }
  .layer-card h3 em {
    font-family: var(--font-serif); font-style: italic; color: var(--brand);
  }
  .layer-card p {
    margin: 0; color: var(--fg-muted); font-size: 14px; line-height: 1.5;
  }
  .layer-card .arrow {
    margin-top: auto;
    font-family: var(--font-mono); font-size: 12px;
    color: var(--brand);
    display: inline-flex; gap: 6px;
  }

  /* ============================================================
     INTELLIGENCE DASHBOARD MOCK
     ============================================================ */
  .intel-frame {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: var(--r-2xl);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }
  .intel-chrome {
    display: grid; grid-template-columns: 240px 1fr 200px;
    border-bottom: 1px solid var(--divider);
  }
  .intel-side {
    padding: 22px 18px;
    border-right: 1px solid var(--divider);
    background: var(--bg-elev-1);
    min-height: 460px;
  }
  .intel-side .group { margin-bottom: 22px; }
  .intel-side .group-name {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--fg-faint); letter-spacing: .12em; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .intel-side .item {
    padding: 7px 10px;
    font-size: 13px; color: var(--fg-muted);
    border-radius: var(--r-sm);
    display: flex; justify-content: space-between; align-items: center;
    margin: 0 -10px;
  }
  .intel-side .item.active { background: var(--brand-soft); color: var(--brand); font-weight: 500; }
  .intel-side .item .pip { width: 5px; height: 5px; border-radius: 999px; background: var(--brand); }
  .intel-main { padding: 26px 28px; }
  .intel-main .breadcrumb {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--fg-subtle); letter-spacing: .06em;
    display: flex; gap: 8px; margin-bottom: 6px;
  }
  .intel-main h4 {
    margin: 0 0 4px;
    font-size: 22px; font-weight: 500; letter-spacing: -0.012em;
  }
  .intel-main h4 em { font-family: var(--font-serif); font-style: italic; color: var(--brand); }
  .intel-main .desc {
    font-size: 13px; color: var(--fg-muted);
    margin-bottom: 24px;
  }
  .intel-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
    margin-bottom: 24px;
  }
  .intel-stat {
    border: 1px solid var(--divider);
    border-radius: var(--r-lg);
    padding: 14px 16px;
    background: var(--bg-elev-1);
  }
  .intel-stat .lbl {
    font-family: var(--font-mono); font-size: 10.5px;
    color: var(--fg-faint); letter-spacing: .08em; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .intel-stat .val {
    font-size: 28px; font-weight: 400; letter-spacing: -0.022em;
    color: var(--fg); line-height: 1;
  }
  .intel-stat .val em { font-family: var(--font-serif); font-style: italic; color: var(--brand); }
  .intel-stat .delta { margin-top: 6px; font-size: 12px; font-family: var(--font-mono); color: var(--success); }
  .intel-stat .delta.neg { color: var(--danger); }

  .intel-chart {
    background: var(--bg-elev-1);
    border: 1px solid var(--divider);
    border-radius: var(--r-lg);
    padding: 16px;
    height: 180px;
    position: relative;
  }
  .intel-chart .chart-head {
    display: flex; justify-content: space-between; margin-bottom: 8px;
  }
  .intel-chart .chart-head b { font-size: 12.5px; font-weight: 500; }
  .intel-chart .chart-head span {
    font-family: var(--font-mono); font-size: 10.5px;
    color: var(--fg-subtle); letter-spacing: .04em;
  }
  .intel-chart svg { width: 100%; height: 130px; }

  .intel-right {
    padding: 22px 18px;
    border-left: 1px solid var(--divider);
    background: var(--bg-elev-1);
    display: flex; flex-direction: column; gap: 18px;
  }
  .intel-right h5 {
    margin: 0;
    font-family: var(--font-mono); font-size: 10px;
    color: var(--fg-faint); letter-spacing: .12em; text-transform: uppercase;
  }
  .intel-insight {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 12px 14px;
    font-size: 12.5px; line-height: 1.5;
    color: var(--fg);
  }
  .intel-insight b { font-weight: 500; }
  .intel-insight em { font-family: var(--font-serif); font-style: italic; color: var(--brand); font-size: 14px; }
  .intel-insight .src {
    margin-top: 8px;
    font-family: var(--font-mono); font-size: 10px;
    color: var(--fg-faint); letter-spacing: .06em; text-transform: uppercase;
  }

  .insight-chips {
    margin-top: 28px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .chip-card {
    background: var(--bg-elev-1);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 8px;
    min-height: 120px;
  }
  .chip-card .lbl {
    font-family: var(--font-mono); font-size: 10.5px;
    color: var(--fg-faint); letter-spacing: .08em; text-transform: uppercase;
  }
  .chip-card .q { font-size: 13.5px; color: var(--fg); line-height: 1.4; }
  .chip-card .persona {
    font-family: var(--font-mono); font-size: 10.5px;
    color: var(--brand); letter-spacing: .04em;
    margin-top: auto;
  }

  /* ============================================================
     TWO-SIDED
     ============================================================ */
  .twosided-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .ts-card {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: var(--r-2xl);
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .ts-card .ts-head {
    padding: 22px 26px;
    border-bottom: 1px solid var(--divider);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .ts-card .ts-head .lbl {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--fg-subtle); letter-spacing: .1em; text-transform: uppercase;
  }
  .ts-card .ts-head h4 {
    margin: 6px 0 0;
    font-size: 22px; font-weight: 500; letter-spacing: -0.014em;
  }
  .ts-card .ts-head h4 em { font-family: var(--font-serif); font-style: italic; color: var(--brand); }
  .ts-card .ts-head .who {
    font-size: 12.5px; color: var(--fg-muted);
    text-align: right; max-width: 14ch; line-height: 1.4;
  }
  .ts-body { padding: 22px 26px 26px; }

  .ts-bar-row {
    display: grid; grid-template-columns: 130px 1fr 60px;
    align-items: center; gap: 14px;
    padding: 9px 0;
    border-bottom: 1px dashed var(--divider);
    font-size: 13px;
  }
  .ts-bar-row:last-child { border-bottom: 0; }
  .ts-bar-row .lbl { color: var(--fg-muted); }
  .ts-bar-row .bar {
    height: 8px; background: var(--bg-sunken); border-radius: 999px;
    overflow: hidden; position: relative;
  }
  .ts-bar-row .bar .fill {
    height: 100%; background: var(--brand); border-radius: 999px;
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.15);
  }
  .ts-bar-row .val {
    font-family: var(--font-mono); font-size: 12px;
    text-align: right; color: var(--fg);
    font-variant-numeric: tabular-nums;
  }

  /* ============================================================
     DEVELOPER
     ============================================================ */
  .dev-grid {
    display: grid; grid-template-columns: 1fr 1.2fr; gap: 56px;
    align-items: start;
  }
  .dev-text h3 {
    margin: 0 0 16px;
    font-size: clamp(28px, 3.2vw, 40px);
    font-weight: 400; letter-spacing: -0.024em; line-height: 1.05;
    max-width: 16ch;
  }
  .dev-text h3 em { font-family: var(--font-serif); font-style: italic; color: var(--brand); }
  .dev-text p {
    color: var(--fg-muted); font-size: 16px; line-height: 1.55;
    margin: 0 0 24px;
  }
  .dev-bullets {
    display: grid; gap: 12px;
    list-style: none; padding: 0; margin: 0 0 28px;
  }
  .dev-bullets li {
    display: grid; grid-template-columns: 20px 1fr; gap: 12px;
    font-size: 14px; color: var(--fg);
  }
  .dev-bullets li .check {
    width: 18px; height: 18px; border-radius: 999px;
    background: var(--brand-soft); color: var(--brand);
    border: 1px solid var(--brand-border);
    display: grid; place-items: center;
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    margin-top: 1px;
  }
  .dev-bullets li b { font-weight: 500; }
  .dev-bullets li span { color: var(--fg-muted); }

  .code-frame {
    background: var(--bg-elev-1);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .code-tabs {
    display: flex; gap: 0;
    background: var(--bg-sunken);
    border-bottom: 1px solid var(--divider);
    padding: 0 12px;
  }
  .code-tab {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    font-family: var(--font-mono); font-size: 11.5px;
    color: var(--fg-muted); padding: 12px 14px;
    border-bottom: 1.5px solid transparent;
    transition: color .12s ease, border-color .12s ease;
  }
  .code-tab[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
  .code-body {
    padding: 22px 24px 24px;
    font-family: var(--font-mono); font-size: 12.5px; line-height: 1.7;
    overflow-x: auto;
  }
  .code-body .tk-com { color: var(--fg-faint); }
  .code-body .tk-key { color: oklch(0.50 0.16 268); }
  [data-theme="dark"] .code-body .tk-key { color: oklch(0.78 0.12 280); }
  .code-body .tk-str { color: oklch(0.50 0.12 152); }
  [data-theme="dark"] .code-body .tk-str { color: oklch(0.80 0.12 152); }
  .code-body .tk-num { color: oklch(0.55 0.16 26); }
  [data-theme="dark"] .code-body .tk-num { color: oklch(0.78 0.14 26); }
  .code-body .tk-fn  { color: oklch(0.55 0.12 230); }
  [data-theme="dark"] .code-body .tk-fn  { color: oklch(0.78 0.12 230); }

  /* ============================================================
     COMPARE TABLE
     ============================================================ */
  .compare-wrap {
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    overflow: hidden;
    background: var(--bg-elev-2);
  }
  .compare-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .compare-table th, .compare-table td {
    padding: 14px 18px; text-align: left;
    border-bottom: 1px solid var(--divider);
  }
  .compare-table thead th {
    font-family: var(--font-mono); font-size: 10.5px;
    color: var(--fg-subtle); letter-spacing: .08em; text-transform: uppercase;
    background: var(--bg-sunken);
    font-weight: 500;
    text-align: center;
  }
  .compare-table thead th:first-child { text-align: left; }
  .compare-table thead th.brand { color: var(--brand); background: var(--brand-soft); }
  .compare-table tbody td { text-align: center; color: var(--fg-muted); }
  .compare-table tbody td:first-child { text-align: left; color: var(--fg); font-weight: 500; }
  .compare-table tbody td.brand { background: color-mix(in oklch, var(--brand) 4%, var(--bg-elev-2)); color: var(--fg); }
  .compare-table tbody tr:last-child td { border-bottom: 0; }
  .compare-cell {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 12px;
    line-height: 1;
  }
  .compare-cell .mark.full   { color: var(--brand); }
  .compare-cell .mark.part   { color: var(--warning); }
  .compare-cell .mark.none   { color: var(--fg-faint); }

  /* ============================================================
     PRICING
     ============================================================ */
  .pricing-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .price-card {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    padding: 28px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .price-card.featured {
    border-color: var(--brand);
    box-shadow: 0 0 0 1px var(--brand), var(--shadow-md);
  }
  .price-card .tier {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--fg-subtle); letter-spacing: .12em; text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center;
  }
  .price-card .tier .tag-brand {
    color: var(--brand);
    background: var(--brand-soft); border: 1px solid var(--brand-border);
    padding: 3px 7px; border-radius: var(--r-full);
    letter-spacing: .1em;
  }
  .price-card .price {
    font-weight: 400; font-size: 40px; letter-spacing: -0.024em; line-height: 1;
  }
  .price-card .price em { font-family: var(--font-serif); font-style: italic; color: var(--brand); }
  .price-card .price-sub {
    font-family: var(--font-mono); font-size: 11.5px;
    color: var(--fg-subtle); letter-spacing: .04em;
  }
  .price-card .desc { font-size: 13.5px; color: var(--fg-muted); line-height: 1.5; }

function MarginChart() {
  const points = [
    [0,38],[1,41],[2,39],[3,45],[4,52],[5,49],
    [6,56],[7,61],[8,58],[9,64],[10,67],[11,72],
  ];
  const w = 540, h = 130, pad = 8;
  const xMax = points[points.length - 1][0];
  const yMin = 30, yMax = 80;
  const sx = (x) => pad + (x / xMax) * (w - pad * 2);
  const sy = (y) => h - pad - ((y - yMin) / (yMax - yMin)) * (h - pad * 2);
  const line = points.map(([x,y],i) => `${i?'L':'M'}${sx(x).toFixed(1)},${sy(y).toFixed(1)}`).join(' ');
  const area = `${line} L${sx(xMax).toFixed(1)},${h-pad} L${sx(0).toFixed(1)},${h-pad} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <defs>
        <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor="var(--brand)" stopOpacity=".28" />
          <stop offset="100%" stopColor="var(--brand)" stopOpacity="0" />
        </linearGradient>
      </defs>
      {[40,50,60,70].map(y => (
        <line key={y} x1={pad} x2={w-pad} y1={sy(y)} y2={sy(y)} stroke="var(--divider)" strokeDasharray="2 4" />
      ))}
      <path d={area} fill="url(#g1)" />
      <path d={line} fill="none" stroke="var(--brand)" strokeWidth="1.75" strokeLinejoin="round" />
      {points.map(([x,y],i) => (
        <circle key={i} cx={sx(x)} cy={sy(y)} r={i===points.length-1?3.5:1.5} fill="var(--brand)" />
      ))}
    </svg>
  );
}

function SalesModal({ onClose }) {
  const [fields, setFields] = React.useState({ name:'', email:'', phone:'', usecase:'', message:'' });
  const [status, setStatus] = React.useState('idle'); // idle | submitting | success | error
  const firstRef = React.useRef(null);

  React.useEffect(() => {
    firstRef.current?.focus();
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  const set = (k) => (e) => setFields((p) => ({ ...p, [k]: e.target.value }));

  const handleSubmit = async (e) => {
    e.preventDefault();
    setStatus('submitting');
    try {
      const res = await fetch(FORMSPREE_ENDPOINT, {
        method: 'POST',
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: fields.name,
          email: fields.email,
          phone: fields.phone || '—',
          use_case: fields.usecase || '—',
          message: fields.message || '—',
        }),
      });
      if (res.ok) {
        setStatus('success');
      } else {
        setStatus('error');
      }
    } catch {
      setStatus('error');
    }
  };

  return (
    <div className="modal-backdrop" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }} role="dialog" aria-modal="true" aria-label="Talk to sales">
      <div className="modal-box">
        <button className="modal-close" onClick={onClose} aria-label="Close">✕</button>

        {status === 'success' ? (
          <div className="modal-success">
            <div className="check-circle">✓</div>
            <h3>We'll be in <em>touch</em>.</h3>
            <p>Thanks — Manju will reply within one business day.</p>
            <button className="btn btn--secondary" style={{marginTop:8}} onClick={onClose}>Done</button>
          </div>
        ) : (
          <>
            <div className="modal-eyebrow">Talk to sales</div>
            <h2 className="modal-title">Let's see if we're a <em>fit</em>.</h2>
            <p className="modal-sub">Tell us about your product and we'll reach out within one business day.</p>

            <form onSubmit={handleSubmit}>
              <div className="modal-field">
                <label htmlFor="ts-name">Name</label>
                <input ref={firstRef} id="ts-name" type="text" placeholder="Jane Smith" required value={fields.name} onChange={set('name')} autoComplete="name" />
              </div>
              <div className="modal-field">
                <label htmlFor="ts-email">Work email</label>
                <input id="ts-email" type="email" placeholder="jane@company.com" required value={fields.email} onChange={set('email')} autoComplete="email" />
              </div>
              <div className="modal-field">
                <label htmlFor="ts-phone">Phone <span className="opt">optional</span></label>
                <input id="ts-phone" type="tel" placeholder="+1 (555) 000-0000" value={fields.phone} onChange={set('phone')} autoComplete="tel" />
              </div>
              <div className="modal-field">
                <label htmlFor="ts-usecase">Primary use case</label>
                <select id="ts-usecase" required value={fields.usecase} onChange={set('usecase')} style={{cursor:'pointer'}}>
                  <option value="" disabled>Select one…</option>
                  {USE_CASES.map((u) => <option key={u} value={u}>{u}</option>)}
                </select>
              </div>
              <div className="modal-field">
                <label htmlFor="ts-msg">Anything else <span className="opt">optional</span></label>
                <textarea id="ts-msg" placeholder="Current stack, event volume, timeline…" value={fields.message} onChange={set('message')} />
              </div>

              {status === 'error' && (
                <div style={{fontSize:13,color:'var(--danger)',marginBottom:8}}>Something went wrong — please try again or email <a href="mailto:manju@fornaxlabs.xyz" style={{color:'var(--brand)'}}>manju@fornaxlabs.xyz</a> directly.</div>
              )}

              <div className="modal-footer">
                <button type="submit" className="btn btn--primary btn--lg" disabled={status==='submitting'}>
                  {status === 'submitting' ? 'Sending…' : 'Send message →'}
                </button>
                <button type="button" className="btn btn--secondary btn--lg" data-cal-link={CAL_LINK} data-cal-config='{"layout":"month_view"}' onClick={onClose}>
                  Book a demo call instead
                </button>
                <div className="note">Or email us at <a href="mailto:manju@fornaxlabs.xyz">manju@fornaxlabs.xyz</a></div>
              </div>
            </form>
          </>
        )}
      </div>
    </div>
  );
}

function App() {
  const [theme, setThemeState] = React.useState(() => {
    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || saved === 'light') return saved;
    } catch(e) {}
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  });
  const [modalOpen, setModalOpen] = React.useState(false);
  const openModal = () => setModalOpen(true);
  const closeModal = () => setModalOpen(false);

  const setTheme = React.useCallback((t) => {
    setThemeState(t);
    try { localStorage.setItem('theme', t); } catch(e) {}
  }, []);

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);

  React.useEffect(() => {
    document.body.style.overflow = modalOpen ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [modalOpen]);

  return (
    <>
      <Nav openModal={openModal} />
      <main id="main-content">
        <Hero openModal={openModal} />
        <FragmentationSection />
        <PlatformSection />
        <IntelligenceSection />
        <TwoSidedSection />
        <DeveloperSection />
        <CompareSection />
        <CTABanner openModal={openModal} />
      </main>
      <Footer theme={theme} setTheme={setTheme} />
      {modalOpen && <SalesModal onClose={closeModal} />}
    </>
  );
}
